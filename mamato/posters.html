<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mama Che Fuego</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --nero:#0D0608;
  --rosso:#E01E37;
  --senape:#F2B33D;   /* oro del logo */
  --crema:#FFF1DC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}
.board{position:relative;width:1080px;overflow:hidden;background:var(--nero);color:var(--crema);font-family:'Montserrat',sans-serif}
.board.feed{height:1350px}
.board.story{height:1920px}
.layer{position:absolute;inset:0;pointer-events:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* contenuto: un blocco in alto e uno in basso, così il 9:16 si adatta da solo */
.top,.bottom{position:absolute;left:84px;right:84px;display:flex;flex-direction:column;z-index:2}
.center{align-items:center;text-align:center}
.left{align-items:flex-start;text-align:left}

.logo{height:46px}
.serif{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;line-height:.95}
.display{font-family:'Anton';text-transform:uppercase;letter-spacing:.05em;line-height:.86}
.caps{font-weight:600;letter-spacing:.42em;text-transform:uppercase;font-size:19px;line-height:1.5}
.gold{color:var(--senape)}
.rule{width:84px;height:2px;background:var(--senape);margin:26px 0}
.row{display:flex;gap:28px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--senape)}

.book{font-weight:700;font-size:24px;letter-spacing:.2em;margin-top:30px}
.book span{color:var(--senape)}
.addr{font-weight:500;font-size:14px;letter-spacing:.38em;margin-top:12px;opacity:.75}
.frame{position:absolute;inset:30px;border:1.5px solid rgba(255,241,220,.45);z-index:3;pointer-events:none}
/* nel 9:16 la foto entra tutta in altezza: si stringe per escludere l'insegna */
.story .bg-c{transform:scale(1.32);transform-origin:center 100%}
.grain{mix-blend-mode:overlay;opacity:.22}
</style>
</head>
<body>
<!-- A-B-C Latin night (foto del locale) · D-E-F cena animata e karaoke (scene di canto) -->
<div class="board feed" id="a-facciata-feed"></div>
<div class="board feed" id="b-consolle-feed"></div>
<div class="board feed" id="c-folla-feed"></div>
<div class="board feed" id="d-cantante-feed"></div>
<div class="board feed" id="e-ragazze-feed"></div>
<div class="board feed" id="f-tavolata-feed"></div>
<div class="board story" id="a-facciata-story"></div>
<div class="board story" id="b-consolle-story"></div>
<div class="board story" id="c-folla-story"></div>
<div class="board story" id="d-cantante-story"></div>
<div class="board story" id="e-ragazze-story"></div>
<div class="board story" id="f-tavolata-story"></div>

<script>
const LOGO = `<img class="logo" src="assets/logo-crema.png">`;
const shade = css => `<div class="layer" style="background:${css}"></div>`;
const grain = id => `<svg class="layer grain" width="100%" height="100%"><filter id="n${id}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n${id})"/></svg>`;

const BOOK = `<div class="book">PRENOTA IL TUO TAVOLO · <span>0522 1900196</span></div>
  <div class="addr">VIA G. GALILEI, 13 · ZONA RAME · REGGIOLO (RE)</div>`;
const GENRES = `<div class="caps gold" style="font-size:16px;letter-spacing:.36em">Reggaeton · Latin hits · Dembow · Brazilian funk</div>`;
const DATE = time => `<div class="row"><span class="caps">Venerdì 30 ottobre</span><span class="dot"></span><span class="caps">Dalle ${time}</span></div>`;
const TO_DINNER = `<div class="serif" style="font-size:31px;margin-top:26px;opacity:.9">Dalle 20:30 cena animata e karaoke con Berni Show · cena alla carta</div>`;
const TO_NIGHT = `<div class="serif" style="font-size:31px;margin-top:26px;opacity:.9">A seguire, dalle 23:30, Mama Che Fuego con Amista &amp; Maret The Voice</div>`;

const S = {
  // A · la facciata del Mamatò: titolo in basso, la sala illuminata resta protagonista
  facciata: (T, B) => `
    <img class="bg" src="assets/bg-a-facciata.jpg" style="object-position:center 40%;transform:scale(1.2);transform-origin:center 78%">
    ${shade('linear-gradient(180deg,rgba(13,6,8,.75) 0%,rgba(13,6,8,0) 18%,rgba(13,6,8,0) 38%,rgba(13,6,8,.88) 62%,var(--nero) 86%)')}
    <div class="top center" style="top:${T}px">${LOGO}</div>
    <div class="bottom center" style="bottom:${B}px">
      <div class="serif" style="font-size:96px;margin-bottom:14px">Mama che</div>
      <div class="display" style="font-size:300px;margin-top:-6px">Fuego</div>
      <div class="rule"></div>
      ${DATE('23:30')}
      <div class="serif gold" style="font-size:54px;margin-top:22px">Amista &amp; Maret The Voice</div>
      <div style="margin-top:16px">${GENRES}</div>
      ${TO_DINNER}${BOOK}
    </div>`,

  // B · la consolle col neon: impaginazione editoriale, allineata a sinistra
  consolle: (T, B) => `
    <img class="bg" src="assets/bg-b-consolle.jpg" style="object-position:center 60%">
    ${shade('linear-gradient(180deg,rgba(13,6,8,.9) 0%,rgba(13,6,8,.35) 34%,rgba(13,6,8,.1) 50%,rgba(13,6,8,.85) 72%,var(--nero) 90%)')}
    <div class="top left" style="top:${T}px">
      ${LOGO}
      <div class="serif" style="font-size:96px;margin-top:56px;margin-bottom:14px">Mama che</div>
      <div class="display" style="font-size:300px;margin-top:-4px">Fuego</div>
      <div style="margin-top:20px">${GENRES}</div>
    </div>
    <div class="bottom left" style="bottom:${B}px">
      <div class="row" style="align-items:flex-end;gap:40px">
        <div class="display gold" style="font-size:190px;letter-spacing:.02em">30.10</div>
        <div style="padding-bottom:10px"><div class="caps">Venerdì</div><div class="caps">dalle 23:30</div>
          <div class="serif" style="font-size:44px;margin-top:10px">Amista &amp; Maret The Voice</div></div>
      </div>
      ${TO_DINNER}${BOOK}
    </div>`,

  // C · la folla davanti al Mamatò: tutto centrato, artisti in evidenza
  folla: (T, B) => `
    <img src="assets/bg-c-folla.jpg" class="bg bg-c" style="object-position:center 86%">
    ${shade('linear-gradient(180deg,rgba(13,6,8,.92) 0%,rgba(13,6,8,.7) 22%,rgba(13,6,8,.15) 44%,rgba(13,6,8,.85) 68%,var(--nero) 88%)')}
    <div class="top center" style="top:${T}px">
      ${LOGO}
      <div class="serif" style="font-size:150px;margin-top:60px;line-height:.85">Mama che <span class="gold">Fuego</span></div>
      <div style="margin-top:28px">${GENRES}</div>
    </div>
    <div class="bottom center" style="bottom:${B}px">
      <div class="caps" style="font-size:16px;opacity:.85">On stage</div>
      <div class="display" style="font-size:118px;margin-top:14px">Amista</div>
      <div class="serif gold" style="font-size:46px;margin:6px 0 4px">&amp;</div>
      <div class="display" style="font-size:118px">Maret The Voice</div>
      <div class="rule"></div>
      ${DATE('23:30')}
      ${TO_DINNER}${BOOK}
    </div>`,

  // D · il cantante al microfono tra i tavoli
  cantante: (T, B) => `
    <img class="bg" src="assets/bg-d-cantante.jpg" style="object-position:40% 20%">
    ${shade('linear-gradient(180deg,rgba(13,6,8,.7) 0%,rgba(13,6,8,0) 16%,rgba(13,6,8,0) 44%,rgba(13,6,8,.88) 66%,var(--nero) 86%)')}
    <div class="top center" style="top:${T}px">${LOGO}</div>
    <div class="bottom center" style="bottom:${B}px">
      <div class="serif" style="font-size:96px;margin-bottom:14px">Cena animata</div>
      <div class="display" style="font-size:250px;margin-top:-2px">Karaoke</div>
      <div class="rule"></div>
      ${DATE('20:30')}
      <div class="serif gold" style="font-size:54px;margin-top:22px">con Berni Show</div>
      <div class="caps" style="font-size:16px;margin-top:14px;opacity:.85">Cena alla carta</div>
      ${TO_NIGHT}${BOOK}
    </div>`,

  // E · le ragazze che cantano a tavola: titolo in alto a sinistra
  ragazze: (T, B) => `
    <img class="bg" src="assets/bg-e-ragazze.jpg" style="object-position:28% center">
    ${shade('linear-gradient(180deg,rgba(13,6,8,.92) 0%,rgba(13,6,8,.55) 26%,rgba(13,6,8,0) 42%,rgba(13,6,8,.1) 56%,rgba(13,6,8,.9) 74%,var(--nero) 90%)')}
    <div class="top left" style="top:${T}px">
      ${LOGO}
      <div class="serif" style="font-size:110px;margin-top:56px;margin-bottom:10px">Cena animata</div>
      <div class="row" style="gap:22px;align-items:center"><span class="serif gold" style="font-size:110px">&amp;</span>
        <span class="display" style="font-size:200px">Karaoke</span></div>
    </div>
    <div class="bottom left" style="bottom:${B}px">
      ${DATE('20:30')}
      <div class="serif gold" style="font-size:54px;margin-top:18px">con Berni Show · cena alla carta</div>
      ${TO_NIGHT}${BOOK}
    </div>`,

  // F · la tavolata in festa: una frase sola, centrata
  tavolata: (T, B) => `
    <img class="bg" src="assets/bg-f-tavolata.jpg" style="object-position:58% center">
    ${shade('linear-gradient(180deg,rgba(13,6,8,.85) 0%,rgba(13,6,8,.3) 24%,rgba(13,6,8,.1) 42%,rgba(13,6,8,.88) 66%,var(--nero) 86%)')}
    <div class="top center" style="top:${T}px">${LOGO}</div>
    <div class="bottom center" style="bottom:${B}px">
      <div class="serif" style="font-size:118px;line-height:.9">Si mangia,<br>si canta.</div>
      <div class="display gold" style="font-size:96px;margin-top:34px;letter-spacing:.08em">Cena animata</div><div class="display" style="font-size:96px;margin-top:6px;letter-spacing:.08em"><span class="serif gold" style="font-size:90px;text-transform:none">&amp;</span> Karaoke</div>
      <div class="rule"></div>
      ${DATE('20:30')}
      <div class="serif" style="font-size:46px;margin-top:18px">con Berni Show · cena alla carta</div>
      ${TO_NIGHT}${BOOK}
    </div>`,
};

function build(el) {
  const story = el.offsetHeight > 1400, kind = el.id.split('-')[1];
  const T = story ? 250 : 74, B = story ? 250 : 70;   // le stories rispettano le safe zone di 250px
  el.innerHTML = S[kind](T, B) + `<div class="frame"></div>` + grain(el.id);
}

document.fonts.ready.then(async () => {
  document.querySelectorAll('.board').forEach(build);
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
