<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mama Che Fuego</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --nero:#070305;
  --rosso:#E01E37;
  --magenta:#FF2E88;
  --neon:#FFE600;
  --bianco:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;display:flex;gap:40px;padding:40px;align-items:flex-start}
.board{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--nero);color:var(--bianco);font-family:'Montserrat',sans-serif}
.abs{position:absolute}
.layer{position:absolute;inset:0;pointer-events:none}

/* titolo a pennarello giallo neon, inclinato, con alone */
.marker{font-family:'Sedgwick Ave Display';color:var(--neon);line-height:.84;white-space:nowrap;text-transform:uppercase;
  transform:rotate(-6deg) skewX(-6deg);
  text-shadow:0 0 6px rgba(255,230,0,.95),0 0 22px rgba(255,214,0,.7),0 0 60px rgba(255,170,0,.45),0 0 120px rgba(255,60,40,.35)}
.serif{font-family:'Bodoni Moda';font-style:italic;font-weight:500;line-height:1}
.caps{font-weight:600;letter-spacing:.42em;text-transform:uppercase;font-size:17px}
.center{left:0;right:0;text-align:center}
.rule{height:1.5px;background:var(--rosso);box-shadow:0 0 8px rgba(224,30,55,.8)}
.details{display:flex;align-items:center;justify-content:center;gap:22px}
.details .sep{width:5px;height:5px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}
.book{font-weight:700;font-size:22px;letter-spacing:.24em}
.book span{color:var(--neon)}
.addr{font-weight:500;font-size:13px;letter-spacing:.4em;opacity:.7;margin-top:10px}
.logo{height:64px;filter:brightness(0) invert(1) drop-shadow(0 0 14px rgba(255,46,136,.45))}
.grain{mix-blend-mode:overlay;opacity:.16}
</style>
</head>
<body>
<div class="board" id="latin"></div>
<div class="board" id="cena"></div>

<script>
// ---------- palme rosse in silhouette (fronde pinnate) ----------
let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function frond(x, y, ang, len, bend, col, w = 1) {
  const a = ang * Math.PI / 180, b = (ang + bend) * Math.PI / 180;
  const cx = x + Math.cos(a) * len * .55, cy = y + Math.sin(a) * len * .55;
  const ex = x + Math.cos(b) * len, ey = y + Math.sin(b) * len;
  const P = t => [(1 - t) ** 2 * x + 2 * (1 - t) * t * cx + t * t * ex, (1 - t) ** 2 * y + 2 * (1 - t) * t * cy + t * t * ey];
  let d = `M${x} ${y} Q${cx} ${cy} ${ex} ${ey}`, leaves = '';
  for (let t = .05; t < .98; t += .042) {
    const [px, py] = P(t), [qx, qy] = P(t + .01);
    const tx = qx - px, ty = qy - py, tl = Math.hypot(tx, ty), ux = tx / tl, uy = ty / tl;
    const L = len * .36 * Math.pow(Math.sin(Math.PI * Math.min(t + .08, 1)), .8) * (.85 + rnd() * .3);
    for (const s of [-1, 1]) {
      const sp = (48 - t * 22) * Math.PI / 180;       // apertura della fogliolina rispetto al rachide
      const vx = ux * Math.cos(sp) - s * uy * Math.sin(sp), vy = uy * Math.cos(sp) + s * ux * Math.sin(sp);
      const lx = px + vx * L, ly = py + vy * L + L * .45;  // le foglioline ricadono
      const mx = px + vx * L * .5 - s * uy * 6, my = py + vy * L * .5 + s * ux * 6;
      leaves += `M${px.toFixed(1)} ${py.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)}`;
    }
  }
  return `<path d="${d}" stroke="${col}" stroke-width="${5 * w}" fill="none" stroke-linecap="round"/>
    <path d="${leaves}" stroke="${col}" stroke-width="${3.6 * w}" fill="none" stroke-linecap="round"/>`;
}
// un ciuffo di fronde da un punto d'angolo
function tuft(x, y, angs, len, cols, glow) {
  return `<g ${glow ? 'filter="url(#palmGlow)"' : ''}>` + angs.map((a, i) =>
    frond(x, y, a, len * (.8 + rnd() * .35), (i % 2 ? 22 : -18), cols[i % cols.length], .9 + rnd() * .4)).join('') + '</g>';
}
function palms(H, extra) {
  const lit = ['#f0203f', '#d4142f', '#ff3355'], mid = ['#8e0a22', '#760a1d', '#a50e29'], dark = ['#3a040f', '#2c030b', '#4a0613'];
  return `<svg class="layer" width="1080" height="${H}" viewBox="0 0 1080 ${H}">
    <defs><filter id="palmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${tuft(-50, -50, [18, 42, 66, 92], 400, mid, false)}
    ${tuft(-40, -70, [34, 62], 330, lit, true)}
    ${tuft(1130, -50, [162, 138, 114, 88], 400, mid, false)}
    ${tuft(1120, -70, [146, 118], 330, lit, true)}
    ${tuft(-60, H * .6, [-22, 4, 30], 250, ['#a10e3c', '#c21245', '#d61c6a'], true)}
    ${tuft(-70, H + 50, [-78, -54, -30], 360, dark, false)}
    ${tuft(1150, H + 50, [-102, -126, -150], 370, dark, false)}
    ${extra || ''}
  </svg>`;
}

// corona disegnata a pennarello
const crown = (w, col = 'var(--neon)', rot = 10) => `<svg width="${w}" height="${w * .72}" viewBox="0 0 100 72" style="transform:rotate(${rot}deg);overflow:visible;filter:drop-shadow(0 0 6px rgba(255,230,0,.9)) drop-shadow(0 0 18px rgba(255,190,0,.5))">
  <path d="M10 56 L6 16 L30 38 L50 6 L70 36 L94 14 L89 56" fill="none" stroke="${col}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M8 66 Q50 58 92 64" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"/></svg>`;

const grain = id => `<svg class="layer grain" width="100%" height="100%"><filter id="n${id}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n${id})"/></svg>`;
const glow = (x, y, r, c, o) => `<div class="layer" style="background:radial-gradient(circle at ${x}px ${y}px, ${c} 0, transparent ${r}px);opacity:${o}"></div>`;
const LOGO = (h = 64) => `<div style="display:inline-flex;flex-direction:column;align-items:center">
  <div style="margin-bottom:-4px">${crown(46, 'var(--neon)', -4)}</div>
  <img class="logo" style="height:${h}px" src="../assets/logo-crema.png"></div>`;
const BOOK = `<div class="book">PRENOTA IL TUO TAVOLO · <span>0522 1900196</span></div>
  <div class="addr">VIA G. GALILEI, 13 · ZONA RAME · REGGIOLO (RE)</div>`;

// ---------- 1 · MAMA CHE FUEGO ----------
document.getElementById('latin').innerHTML = `
  <img class="abs" src="assets/bg-facciata.jpg" style="left:0;top:250px;width:1080px">
  <div class="layer" style="background:linear-gradient(180deg,var(--nero) 230px,rgba(7,3,5,.55) 330px,rgba(7,3,5,0) 470px,rgba(7,3,5,0) 900px,rgba(7,3,5,.75) 1080px,var(--nero) 1240px)"></div>
  ${glow(540, 330, 520, 'rgba(224,30,55,.55)', 1)}${glow(170, 980, 360, 'rgba(255,46,136,.35)', 1)}
  ${palms(1350, tuft(1150, 1080, [-150, -172, 168, -128], 330, ['#5e0818', '#76091c', '#4a0613'], false))}
  <div class="abs center caps" style="top:58px;font-size:16px">Reggaeton &nbsp;/&nbsp; Latin hits &nbsp;/&nbsp; Brazilian &nbsp;/&nbsp; Dembow</div>
  <div class="abs" style="left:110px;top:118px"><div class="marker" style="font-size:250px">Mama</div></div>
  <div class="abs" style="left:150px;top:318px"><div class="marker" style="font-size:190px">Che Fuego</div></div>
  <div class="abs" style="left:720px;top:96px">${crown(130, 'var(--neon)', 12)}</div>
  <div class="abs center" style="top:1006px">
    ${LOGO(60)}
    <div class="serif" style="font-size:44px;margin-top:22px">Amista <span style="color:var(--neon)">&amp;</span> Maret The Voice</div>
    <div style="display:flex;align-items:center;gap:26px;justify-content:center;margin-top:22px">
      <div class="rule" style="width:150px"></div>
      <div class="details caps" style="font-size:18px">Venerdì 30 ottobre<span class="sep"></span>Dalle 23:30</div>
      <div class="rule" style="width:150px"></div></div>
    <div class="serif" style="font-size:24px;margin-top:20px;opacity:.85">Dalle 20:30 cena animata e karaoke con Berni Show · cena alla carta</div>
    <div style="margin-top:20px">${BOOK}</div>
  </div>
  ${grain('l')}`;

// ---------- 2 · CENA ANIMATA & KARAOKE ----------
seed = 5;
document.getElementById('cena').innerHTML = `
  <img class="abs" src="assets/bg-tavolata.jpg" style="left:0;top:120px;width:1080px">
  <div class="layer" style="background:linear-gradient(180deg,var(--nero) 120px,rgba(7,3,5,.7) 200px,rgba(7,3,5,.3) 300px,rgba(7,3,5,.1) 400px,rgba(7,3,5,.15) 640px,rgba(7,3,5,.85) 860px,var(--nero) 990px)"></div>
  ${glow(540, 520, 560, 'rgba(255,150,60,.18)', 1)}<div class="layer" style="background:radial-gradient(ellipse 170px 230px at 215px 735px, rgba(7,3,5,.92) 45%, transparent 100%)"></div>
  ${palms(1350)}
  <div class="abs center" style="top:52px">${LOGO(60)}</div>
  <div class="abs center serif" style="top:742px;font-size:66px;text-shadow:0 2px 20px rgba(0,0,0,.8)">Si mangia, si canta.</div>
  <div class="abs" style="left:96px;top:846px"><div class="marker" style="font-size:152px">Cena animata</div></div>
  <div class="abs" style="left:300px;top:982px"><div class="marker" style="font-size:132px">&amp; Karaoke</div></div>
  <div class="abs center" style="top:1170px">
    <div style="display:flex;align-items:center;gap:22px;justify-content:center">
      <div class="rule" style="width:70px"></div>
      <div class="details caps" style="font-size:14px;letter-spacing:.24em;gap:16px;white-space:nowrap">Venerdì 30 ottobre<span class="sep"></span>Dalle 20:30<span class="sep"></span>Con Berni Show<span class="sep"></span>Cena alla carta</div>
      <div class="rule" style="width:70px"></div></div>
    <div class="serif" style="font-size:22px;margin-top:16px;opacity:.85">A seguire, dalle 23:30, Mama Che Fuego con Amista &amp; Maret The Voice</div>
    <div style="margin-top:16px">${BOOK}</div>
  </div>
  ${grain('c')}`;

document.fonts.ready.then(async () => {
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
