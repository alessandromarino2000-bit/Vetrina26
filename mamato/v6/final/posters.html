<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamatò Editoriale</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="fonts/bodoni.css">
<style>
:root{
  --nero:#0D0608;
  --rosso:#E01E37;
  --oro:#F2B33D;
  --crema:#FFF1DC;
  --hair:rgba(242,179,61,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}
.board{position:relative;width:1080px;overflow:hidden;background:var(--nero);color:var(--crema);
  font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;font-kerning:normal;
  font-feature-settings:"kern","liga","lnum"}
.board.feed{height:1350px}
.board.story{height:1920px}
.layer{position:absolute;inset:0;pointer-events:none}
.photo{position:absolute;display:block;max-width:none}

.mast{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:3}
.mast img{height:42px;display:block}
.tag{margin-top:14px;font-size:11.5px;font-weight:500;letter-spacing:.62em;text-indent:.62em;color:var(--oro);text-transform:uppercase}

.copy{position:absolute;left:76px;right:76px;z-index:3}
.kicker{font-size:15px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--oro)}
.bod{font-family:'Bodoni Moda',serif;font-style:italic;font-variation-settings:"opsz" 96}
.pre{font-weight:500;font-size:84px;line-height:1;letter-spacing:-.01em;margin-bottom:14px;position:relative;display:inline-block;font-variation-settings:"opsz" 30}
/* soft local field behind the kicker so its hairlines survive over hands/shirt/wall */
.pre::before{content:'';position:absolute;left:-90px;right:-110px;top:-36px;bottom:-26px;z-index:-1;
  background:radial-gradient(closest-side,rgba(13,6,8,.55),rgba(13,6,8,.28) 60%,rgba(13,6,8,0))}
.title{display:block}
.title{font-weight:500;line-height:.8;letter-spacing:-.025em;margin-left:-.04em;font-variation-settings:"opsz" 40}
.amp{font-style:inherit;color:var(--oro)}
.hair{height:1px;background:var(--hair)}

.grid{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:44px;padding:32px 0 34px;align-items:stretch}
.col{display:flex;flex-direction:column}
.col .note{margin-top:auto;padding-top:16px}
.col .lab.l2.push{margin-top:auto;padding-top:26px}
.grid .v{background:var(--hair)}
.lab{font-size:13.5px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--oro);margin-bottom:12px}
.date{font-family:'Bodoni Moda',serif;font-weight:500;font-size:60px;line-height:.86;letter-spacing:-.005em;font-variation-settings:"opsz" 72;margin-left:-.03em}
.lab.l2{margin-top:26px}
.note{font-size:13.5px;font-weight:600;letter-spacing:.32em;line-height:1.75;text-transform:uppercase;color:rgba(255,241,220,.8)}
.who{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:48px;line-height:1.06;font-variation-settings:"opsz" 30;margin-top:-4px}

.also{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:400;font-size:25px;line-height:1.35;color:rgba(255,241,220,.86);padding-top:26px;font-variation-settings:"opsz" 12}
.also b{font-weight:600;color:var(--crema)}
.book{margin-top:26px;font-size:21px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.book span{color:var(--rosso)}
.addr{margin-top:10px;font-size:13px;font-weight:500;letter-spacing:.36em;text-transform:uppercase;opacity:.66}
.grain{mix-blend-mode:overlay;opacity:.09}
</style>
</head>
<body>
<div class="board feed"  id="latin-feed"></div>
<div class="board feed"  id="karaoke-feed"></div>
<div class="board story" id="latin-story"></div>
<div class="board story" id="karaoke-story"></div>

<script>
// Two moments, one system: same masthead, same grid, same type. Only photo + words change.
const P = {
  latin: {
    img:'img/latin.jpg',
    note:'Reggaeton · Latin hits<br>Dembow · Brazilian funk',
    pre:'Mama che', title:'Fuego', size:{feed:320, story:350}, gap:.26,
    time:'23:30', lab2:'On stage', who:'Amista <i class="amp">&amp;</i><br>Maret The Voice',
    also:'Dalle 20:30 <b>cena animata e karaoke</b> con Berni Show · cena alla carta',
    // photo placement [top, height, object-position]
    pos:{feed:[-130,-10,1300], story:[-174,0,1580]},
    shade:{
      feed:'linear-gradient(180deg,rgba(13,6,8,.85) 0%,rgba(13,6,8,.45) 8%,rgba(13,6,8,.1) 16%,rgba(13,6,8,0) 22%,rgba(13,6,8,0) 32%,rgba(13,6,8,.28) 42%,rgba(13,6,8,.55) 53%,rgba(13,6,8,.86) 63%,var(--nero) 72%)',
      story:'linear-gradient(180deg,rgba(13,6,8,.88) 0%,rgba(13,6,8,.55) 9%,rgba(13,6,8,.18) 16%,rgba(13,6,8,0) 22%,rgba(13,6,8,0) 34%,rgba(13,6,8,.3) 44%,rgba(13,6,8,.6) 55%,rgba(13,6,8,.9) 66%,rgba(13,6,8,.94) 84%,rgba(13,6,8,.8) 100%)'}
  },
  karaoke: {
    img:'img/karaoke.jpg',
    note:'Cena alla carta',
    pre:'Cena animata <i class="amp">&amp;</i>', title:'Karaoke', size:{feed:262, story:262}, gap:.12,
    time:'20:30', lab2:'Con', who:'Berni Show', pair:['Cena','alla carta'],
    also:'A seguire, dalle 23:30, <b>Mama Che Fuego</b> con Amista &amp; Maret The Voice',
    pos:{feed:[-50,-110,1460], story:[-256,-30,1700]},
    shade:{
      feed:'linear-gradient(180deg,rgba(13,6,8,.9) 0%,rgba(13,6,8,.66) 7%,rgba(13,6,8,.34) 14%,rgba(13,6,8,.12) 21%,rgba(13,6,8,0) 29%,rgba(13,6,8,0) 34%,rgba(13,6,8,.52) 46%,rgba(13,6,8,.86) 60%,var(--nero) 74%)',
      story:'linear-gradient(180deg,rgba(13,6,8,.92) 0%,rgba(13,6,8,.6) 8%,rgba(13,6,8,.2) 15%,rgba(13,6,8,0) 21%,rgba(13,6,8,0) 36%,rgba(13,6,8,.35) 46%,rgba(13,6,8,.66) 56%,rgba(13,6,8,.87) 66%,rgba(13,6,8,.9) 84%,rgba(13,6,8,.8) 100%)'}
  }
};

const grain = id => `<svg class="layer grain" width="100%" height="100%"><filter id="n${id}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n${id})"/></svg>`;

function build(el){
  const [kind, fmt] = el.id.split('-'), d = P[kind], story = fmt==='story';
  const T = story ? 250 : 70, B = story ? 250 : 64;
  el.innerHTML = `
    <img class="photo" src="img/${el.id}.jpg" style="left:0;top:0;width:1080px">
    <div class="layer" style="background:${d.shade[fmt]}"></div>
    <div class="layer" style="background:radial-gradient(ellipse 460px 170px at 50% ${T+42}px,rgba(13,6,8,.62),rgba(13,6,8,0) 100%)"></div>
    <div class="mast" style="top:${T}px"><img src="img/logo-crema.png" alt="Mamatò"><div class="tag">Drinks food and amore</div></div>
    <div class="copy" style="bottom:${B}px">
      <div class="bod pre">${d.pre}</div>
      <div class="bod title" style="font-size:${d.size[fmt]}px">${d.title}</div>
      <div class="hair" style="margin-top:${Math.round(d.size[fmt]*d.gap)}px"></div>
      <div class="grid">
        <div class="col"><div class="lab">Venerdì</div><div class="date">30 ottobre</div><div class="lab l2">Dalle</div><div class="date">${d.time}</div></div>
        <div class="v"></div>
        <div class="col"><div class="lab">${d.lab2}</div><div class="who"${d.pair ? ' style="line-height:.86;margin-top:0"' : ''}>${d.who}</div>${d.pair ? `<div class="lab l2 push">${d.pair[0]}</div><div class="who" style="line-height:.86;margin-top:0">${d.pair[1]}</div>` : `<div class="note">${d.note}</div>`}</div>
      </div>
      <div class="hair"></div>
      <div class="also">${d.also}</div>
      <div class="book">Prenota il tuo tavolo · <span>0522 1900196</span></div>
      <div class="addr">Via G. Galilei, 13 · Zona Rame · Reggiolo (RE)</div>
    </div>
    ${grain(el.id)}`;
}

document.fonts.ready.then(async () => {
  document.querySelectorAll('.board').forEach(build);
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
